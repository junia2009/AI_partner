# main に push されたら AIパラス（index.html）を GitHub Pages に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 公開するのはアプリ本体と PWA 用のファイルだけ（3Dモデルは index.html に埋め込み済み）
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/
          touch _site/.nojekyll

      # knowledge/ の資料から、パラスが調べるための索引を作る（PDF があるときだけ pdftotext を入れる）
      - name: Build knowledge index
        run: |
          if find knowledge -iname '*.pdf' 2>/dev/null | grep -q .; then
            command -v pdftotext >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q poppler-utils)
          fi
          node tools/build-knowledge.mjs _site/knowledge-index.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
